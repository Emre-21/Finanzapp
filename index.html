<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzen</title>
  <meta name="description" content="Persönlicher Finanzplaner: Einnahmen, Fixkosten, Ausgaben und Monatsabschluss.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finanzen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="view"></main>
  <button class="fab" id="fab" data-a="addExpense" aria-label="Ausgabe eintragen">+</button>
  <nav id="nav">
    <button data-a="go" data-v="uebersicht"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Übersicht</span></button>
    <button data-a="go" data-v="verlauf"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Verlauf</span></button>
    <button data-a="go" data-v="planung"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Planung</span></button>
    <button data-a="go" data-v="vermoegen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/></svg><span>Vermögen</span></button>
  </nav>
  <div id="sheet" hidden><div class="scrim" data-a="closeSheet"></div><div class="panel" role="dialog" aria-modal="true"></div></div>
  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
