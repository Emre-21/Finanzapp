<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzen</title>
  <meta name="description" content="Persönlicher Finanzplaner: Einnahmen, Fixkosten, Ausgaben und Monatsabschluss.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="view"></main>
  <button class="fab" id="fab" data-a="addExpense" aria-label="Ausgabe eintragen">+</button>
  <nav id="nav">
    <button data-a="go" data-v="uebersicht"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Übersicht</span></button>
    <button data-a="go" data-v="ausgaben"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="13" rx="2.5"/><path d="M3.5 10h17M7 15h4"/></svg><span>Ausgaben</span></button>
    <button data-a="go" data-v="fixkosten"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M7 8.5c0-1.7 2.2-2.5 5-2.5s5 .8 5 2.5-2.2 2.4-5 3-5 1.3-5 3 2.2 2.5 5 2.5 5-.8 5-2.5"/></svg><span>Fixkosten</span></button>
    <button data-a="go" data-v="einnahmen"><svg viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/><path d="M5 21h14"/></svg><span>Einnahmen</span></button>
    <button data-a="go" data-v="vermoegen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/></svg><span>Vermögen</span></button>
    <button data-a="go" data-v="statistik"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 17v-5M12 17V7M17 17v-8"/></svg><span>Statistik</span></button>
  </nav>
  <div id="sheet" hidden><div class="scrim" data-a="closeSheet"></div><div class="panel" role="dialog" aria-modal="true"></div></div>
  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
